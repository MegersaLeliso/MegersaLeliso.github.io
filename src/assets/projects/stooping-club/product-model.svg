<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/></marker>
    <style>
      .t{font-size:17px;fill:#222;font-weight:600}
      .s{font-size:13px;fill:#555}
      .h{font-size:12px;letter-spacing:.12em;fill:#888;font-weight:600}
      .box{fill:#fff;stroke:#2b2b2b;stroke-width:1.4}
      .acc{fill:#f6efe6;stroke:#a0622d;stroke-width:1.4}
      .l{stroke:#3a3a3a;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <rect width="1200" height="520" fill="#FAFAF8"/>
  <text x="40" y="48" font-size="22" font-weight="700" fill="#1f1f1f">Stooping Club — How a Free Chain Store Works</text>
  <text x="40" y="72" class="s">Conceptual product model · student-run · Addis Ababa</text>

  <!-- Stages -->
  <g>
    <rect x="40" y="130" width="240" height="150" rx="12" class="box"/>
    <text x="60" y="160" class="h">01 · SUPPLY</text>
    <text x="60" y="190" class="t">Donors</text>
    <text x="60" y="214" class="s">Individuals and partners give</text>
    <text x="60" y="232" class="s">used electronics and books</text>
    <text x="60" y="250" class="s">instead of discarding them</text>

    <rect x="330" y="130" width="240" height="150" rx="12" class="box"/>
    <text x="350" y="160" class="h">02 · CATALOG</text>
    <text x="350" y="190" class="t">Online listing</text>
    <text x="350" y="214" class="s">Each item is posted to the</text>
    <text x="350" y="232" class="s">shared online store — priced</text>
    <text x="350" y="250" class="s">at zero</text>

    <rect x="620" y="130" width="240" height="150" rx="12" class="box"/>
    <text x="640" y="160" class="h">03 · DEMAND</text>
    <text x="640" y="190" class="t">Students</text>
    <text x="640" y="214" class="s">Browse and claim what they</text>
    <text x="640" y="232" class="s">need for school — no payment</text>

    <rect x="910" y="130" width="250" height="150" rx="12" class="acc"/>
    <text x="930" y="160" class="h">04 · GROWTH</text>
    <text x="930" y="190" class="t">Chain expansion</text>
    <text x="930" y="214" class="s">Endorsements and partners</text>
    <text x="930" y="232" class="s">bring new donors and new</text>
    <text x="930" y="250" class="s">student communities</text>

    <path d="M280 205 H330" class="l" marker-end="url(#a)"/>
    <path d="M570 205 H620" class="l" marker-end="url(#a)"/>
    <path d="M860 205 H910" class="l" marker-end="url(#a)"/>
    <path d="M1035 280 V330 H160 V280" class="l" marker-end="url(#a)" stroke-dasharray="6 4"/>
    <text x="600" y="352" class="s" text-anchor="middle">flywheel: visible impact → trust → more donations</text>
  </g>

  <!-- CPO role -->
  <rect x="40" y="390" width="1120" height="96" rx="12" fill="#fff" stroke="#e0e0da"/>
  <text x="60" y="420" class="h">CHIEF PRODUCT OFFICER · AUG 2024 – PRESENT</text>
  <text x="60" y="452" class="s" font-size="14">Owns the product experience end-to-end: how donations are promoted, how items reach students,</text>
  <text x="60" y="472" class="s" font-size="14">and the endorsements and partnerships that help the store grow.</text>
</svg>
