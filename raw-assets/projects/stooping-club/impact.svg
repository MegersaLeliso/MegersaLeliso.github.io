<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <style>
    .k{font-size:64px;font-weight:700;fill:#1f1f1f;letter-spacing:-.02em}
    .lab{font-size:15px;fill:#444}
    .h{font-size:12px;letter-spacing:.12em;fill:#888;font-weight:600}
  </style>
  <rect width="1200" height="420" fill="#FAFAF8"/>
  <text x="40" y="56" font-size="22" font-weight="700" fill="#1f1f1f">Stooping Club — Impact</text>

  <rect x="40" y="96" width="350" height="270" rx="14" fill="#fff" stroke="#e0e0da"/>
  <text x="70" y="136" class="h">DONATIONS PROMOTED</text>
  <text x="70" y="226" class="k">$8,000+</text>
  <rect x="70" y="256" width="290" height="4" rx="2" fill="#a0622d"/>
  <text x="70" y="294" class="lab">in donated electronics and</text>
  <text x="70" y="316" class="lab">books promoted to students</text>

  <rect x="425" y="96" width="350" height="270" rx="14" fill="#fff" stroke="#e0e0da"/>
  <text x="455" y="136" class="h">STRATEGIC ENDORSEMENTS</text>
  <text x="455" y="226" class="k">5+</text>
  <g fill="#a0622d">
    <circle cx="465" cy="258" r="9"/><circle cx="495" cy="258" r="9"/><circle cx="525" cy="258" r="9"/><circle cx="555" cy="258" r="9"/><circle cx="585" cy="258" r="9"/>
  </g>
  <circle cx="615" cy="258" r="9" fill="none" stroke="#a0622d" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="455" y="294" class="lab">secured to grow reach and</text>
  <text x="455" y="316" class="lab">credibility with donors</text>

  <rect x="810" y="96" width="350" height="270" rx="14" fill="#fff" stroke="#e0e0da"/>
  <text x="840" y="136" class="h">MODEL</text>
  <text x="840" y="200" font-size="34" font-weight="700" fill="#1f1f1f">Free online</text>
  <text x="840" y="240" font-size="34" font-weight="700" fill="#1f1f1f">chain store</text>
  <rect x="840" y="256" width="290" height="4" rx="2" fill="#a0622d"/>
  <text x="840" y="294" class="lab">student-run, based in</text>
  <text x="840" y="316" class="lab">Addis Ababa, Ethiopia</text>
</svg>
